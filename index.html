<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홈</title>
  <style>
    /* 보내주신 네비게이션 및 페이지 관련 스타일 */
    nav {
      position:fixed; top:0; left:0; right:0; z-index:999;
      background:rgba(250,250,247,.97); backdrop-filter:blur(8px);
      border-bottom:1px solid var(--line); height:64px;
      display:flex; align-items:center; padding:0 5.5%; justify-content:space-between;
    }
    .nav-logo { display:flex; align-items:center; cursor:pointer; text-decoration:none; }
    .nav-logo-svg { display:block; height:38px; width:auto; }
    .nav-links { display:flex; list-style:none; gap:2px; }
    
    /* 💡 버튼 태그 스타일을 a 태그(링크)로 자연스럽게 전환 */
    .nav-links li a {
      display: inline-block; text-decoration: none;
      background:none; border:none; padding:8px 14px; font-size:14px; font-weight:500;
      color:var(--mgray); border-radius:3px; transition:all .2s; letter-spacing:0.2px;
    }
    .nav-links li a:hover { color:var(--dark); }
    .nav-links li a.active { color:var(--dark); font-weight:700; }
    .nav-links li a.cta {
      background:var(--org); color:#fff; margin-left:6px; font-weight:700;
    }
    .nav-links li a.cta:hover { background:var(--org-dim); }

    /* 💡 각 파일이 독립되었으므로 display:none 처리하던 .page 클래스는 제거하고 애니메이션만 유지합니다 */
    .pages { padding-top:64px; }
    .page { animation:fadeUp .35s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">
      <!-- 기존에 쓰시던 로고 SVG 이미지가 들어가는 자리입니다 -->
      <span class="nav-logo-svg">LOGO</span> 
    </a>
    <ul class="nav-links">
      <li><a href="about.html">회사소개</a></li>
      <li><a href="capability.html">제조 및 개발 역량</a></li>
      <li><a href="quality.html">품질 및 위생</a></li>
      <li><a href="contact.html" class="cta">사업문의</a></li>
    </ul>
  </nav>

  <div class="pages">
    <!-- 메인 페이지 내용 (Home) -->
    <div class="page">
      <h2>여기에 기존 메인 화면(Home)의 본문 내용을 넣어주세요.</h2>
    </div>
  </div>

  <footer>
    <p>홈페이지 정보 (주소, 연락처 등)</p>
  </footer>

</body>
</html>
